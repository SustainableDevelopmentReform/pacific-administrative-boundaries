            - {code: manihiki, name: Manihiki, lon: -160.999, lat: -10.419, group: northern, pcrafi_iid: 10}
            - {code: penrhyn, name: Penrhyn, name_alt: Tongareva, lon: -157.974, lat: -8.995, group: northern, pcrafi_iid: 12}
        notes: >-
          Geometry from LINZ (official NZ topographic land outline). Layer coverage: 52251 = Rarotonga, Aitutaki,
          Manuae, Takutea, Atiu, Mitiaro, Mauke, Mangaia, Manihiki, Rakahanga; 52293 = Palmerston, Pukapuka,
          Nassau; 52203 = Penrhyn; 52222 = Suwarrow. grp_name agrees with nearest-point assignment for every
          polygon (0 mismatches); farthest part 16.7 km (Penrhyn). Island codes are name slugs; PCRAFI iid
          (and group gid) are listed per island so census/PCRAFI attributes can be joined.
      - level_code: admin1
        level_type: region
        level_name_local: Group
        layer: null
        code_scheme: name-slug
        nests: true
        derive:
          method: dissolve_children
          child_level: admin2
          child_source: cok-linz-island-polygons-topo
          groups:   # names/membership from PCRAFI ck_group/ck_island gid (1 Rarotonga, 2 Southern, 3 Northern)
            rarotonga: {name: Rarotonga, pcrafi_gid: 1, members: [rarotonga]}
            southern: {name: Southern Group, pcrafi_gid: 2, members: [aitutaki, manuae, takutea, atiu, mitiaro, mauke, mangaia, palmerston]}
            northern: {name: Northern Group, pcrafi_gid: 3, members: [suwarrow, nassau, pukapuka, rakahanga, manihiki, penrhyn]}
        notes: "Groups dissolved from the LINZ islands. Palmerston in the Southern Group per PCRAFI/SDD gid=2 (PCRAFI 'group' text says Northern; gid wins)."
    status: selected
    raw_path: data/raw/COK/cok-linz-island-polygons-topo/
    notes: >-
      Downloaded 2026-11-20 with the project LDS key. 329 polygons, 240.66 km2 total (all 15 islands incl.
      uninhabited Manuae, Takutea, Suwarrow). Island areas (km2): Rarotonga 67.76, Mangaia 48.44, Atiu 28.48,
      Mitiaro 22.88, Mauke 19.20, Aitutaki 17.99, Penrhyn 9.97, Manuae 6.90, Manihiki 5.12, Rakahanga 3.96,
      Pukapuka 3.94, Palmerston 2.54, Nassau 1.21, Suwarrow 1.14, Takutea 1.13. Lagoons excluded (separate
      LINZ lagoon layers 52252/52295/52205/52223 not downloaded). Fields: grp_name, name, macronated.

