            - {code: mitiaro, name: Mitiaro, lon: -157.721, lat: -19.864, group: southern, pcrafi_iid: 6}
            - {code: mauke, name: Mauke, lon: -157.34, lat: -20.161, group: southern, pcrafi_iid: 5}
            - {code: mangaia, name: Mangaia, lon: -157.921, lat: -21.924, group: southern, pcrafi_iid: 3}
