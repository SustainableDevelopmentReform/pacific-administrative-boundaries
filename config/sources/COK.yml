    publisher_type: national
    landing_url: https://data.linz.govt.nz/layer/52251-cook-islands-island-polygons-topo-125k-zone4/
    download_urls:   # LDS WFS; API key sent as header 'Authorization: key <LINZ_API_KEY>' (path form services;key=<LINZ_API_KEY>;/wfs returned 400 for GetFeature)
      - "https://data.linz.govt.nz/services/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=layer-52251&outputFormat=json&count=1000&startIndex=0"
      - "https://data.linz.govt.nz/services/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=layer-52293&outputFormat=json&count=1000&startIndex=0"
      - "https://data.linz.govt.nz/services/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=layer-52203&outputFormat=json&count=1000&startIndex=0"
      - "https://data.linz.govt.nz/services/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=layer-52222&outputFormat=json&count=1000&startIndex=0"
    auth: {type: header, name: Authorization, value_env: LINZ_API_KEY, prefix: "key "}   # LDS API key from env/.env, never recorded
