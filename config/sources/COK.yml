  - source_id: cok-geoboundaries-gbopen
    title: "geoBoundaries gbOpen Cook Islands ADM0"
    publisher: "geoBoundaries (William & Mary geoLab)"
    publisher_type: academic
    landing_url: https://www.geoboundaries.org/countryDownloads.html
    download_urls:
      - https://www.geoboundaries.org/api/current/gbOpen/COK/ALL/
      - https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/COK/ADM0/geoBoundaries-COK-ADM0-all.zip
    retrieval_method: api
    license: {name: CC-BY-4.0, url: https://creativecommons.org/licenses/by/4.0/, redistribution_ok: true, notes: ""}
    publication_date: 2023-12-12
    version: "gbOpen 9469f09"
    format: geojson
    crs: EPSG:4326
    levels:
      - {level_code: admin0, level_type: country, level_name_local: Country, layer: geoBoundaries-COK-ADM0-all/geoBoundaries-COK-ADM0.geojson, name_field: shapeName, code_field: shapeID, parent_field: null, nests: true}
      # [processing] ruling E-005: open derived island and group layers that carry the admin1/admin2
      # hierarchy (and the combined product); the PCRAFI layers stay in the per-country table, restricted.
      - level_code: admin2
        level_type: island
        level_name_local: Island
        layer: null
        code_scheme: name-slug
        nests: true
        use: false   # D-020: superseded by the LINZ-derived islands (cok-linz-island-polygons-topo)
        derive:
          method: islands_from_parts
          max_km: 30
          sources:
            - {source_id: cok-geoboundaries-gbopen, layer: geoBoundaries-COK-ADM0-all/geoBoundaries-COK-ADM0.geojson, method_token: split_from_admin0_by_island}
            - {source_id: cok-spc-sdd-phc2011-boundaries, layer: 2011_phc_cok_cd_4326.geojson, method_token: dissolved_from_census_districts}
          islands:   # approximate island/atoll centres (WGS84) used only to label parts
            - {code: rarotonga, name: Rarotonga, lon: -159.78, lat: -21.23, group: rarotonga}
            - {code: aitutaki, name: Aitutaki, lon: -159.79, lat: -18.86, group: southern}
            - {code: manuae, name: Manuae, lon: -158.94, lat: -19.26, group: southern}
            - {code: takutea, name: Takutea, lon: -158.29, lat: -19.81, group: southern}
            - {code: atiu, name: Atiu, lon: -158.12, lat: -19.99, group: southern}
            - {code: mitiaro, name: Mitiaro, lon: -157.71, lat: -19.87, group: southern}
            - {code: mauke, name: Mauke, lon: -157.34, lat: -20.16, group: southern}
            - {code: mangaia, name: Mangaia, lon: -157.93, lat: -21.92, group: southern}
            - {code: palmerston, name: Palmerston, lon: -163.17, lat: -18.04, group: southern}
            - {code: suwarrow, name: Suwarrow, lon: -163.11, lat: -13.25, group: northern}
            - {code: nassau, name: Nassau, lon: -165.42, lat: -11.56, group: northern}
            - {code: pukapuka, name: Pukapuka, lon: -165.85, lat: -10.88, group: northern}
            - {code: rakahanga, name: Rakahanga, lon: -161.09, lat: -10.03, group: northern}
            - {code: manihiki, name: Manihiki, lon: -161.00, lat: -10.43, group: northern}
            - {code: penrhyn, name: Penrhyn, name_alt: Tongareva, lon: -158.03, lat: -9.00, group: northern}
        notes: "[processing] E-005 open islands: geoBoundaries ADM0 (CC-BY) parts by nearest island point; it lacks the islands of Palmerston, Suwarrow, Nassau, Pukapuka, Rakahanga and Manihiki, which are filled from the open SDD 2011 census districts (populated land only; Suwarrow from its national-park CD). Escalated."
      - level_code: admin1
        level_type: region
        level_name_local: Group
        layer: null
        code_scheme: name-slug
        nests: true
        use: false   # D-020: superseded by the LINZ-derived groups (cok-linz-island-polygons-topo)
        derive:
          method: dissolve_children
          child_level: admin2
          child_source: cok-geoboundaries-gbopen
          groups:
            rarotonga: {name: Rarotonga, members: [rarotonga]}
            southern: {name: Southern Group, members: [aitutaki, manuae, takutea, atiu, mitiaro, mauke, mangaia, palmerston]}
            northern: {name: Northern Group, members: [suwarrow, nassau, pukapuka, rakahanga, manihiki, penrhyn]}
        notes: "[processing] E-005 open groups dissolved from the derived islands (Palmerston in the Southern Group as in the PCRAFI/SDD gid coding)."
    status: alternative
    raw_path: data/raw/COK/cok-geoboundaries-gbopen/
    notes: >-
      ADM0 only (Sentinel-2 2021 land cover raster-to-polygon, 218 km2; lacks Palmerston, Suwarrow, Nassau,
      Pukapuka, Rakahanga, Manihiki). E-005 derived islands/groups superseded by LINZ (D-020); kept as alternative.

