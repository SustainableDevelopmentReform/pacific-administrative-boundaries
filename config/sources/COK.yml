decisions:
  - level_code: admin0
    chosen: cok-linz-island-polygons-topo
    alternatives: [cok-geoboundaries-gbopen, cok-gadm-41]
    reason: "Union of the LINZ island polygons (official NZ topographic outline, CC-BY-4.0, all 15 islands, 240.7 km2); geoBoundaries ADM0 misses 6 islands; GADM restricted."
    escalated: false
  - level_code: admin1
    chosen: cok-linz-island-polygons-topo
    alternatives: [cok-spc-pcrafi-2010-exposure-boundaries, cok-geoboundaries-gbopen]
    reason: >-
      D-020. Groups dissolved from the LINZ islands so admin0/1/2 share one geometry and nest exactly; group
      names, membership and gid taken from PCRAFI ck_group/ck_island (now usable under the SPC agreement).
      PCRAFI ck_group geometry not used because it inherits the outer-island offsets of ck_island.
    escalated: false
  - level_code: admin2
    chosen: cok-linz-island-polygons-topo
    alternatives: [cok-spc-pcrafi-2010-exposure-boundaries, cok-geoboundaries-gbopen, cok-spc-sdd-phc2011-boundaries, cok-gadm-41, cok-osm-admin-relations]
    reason: >-
      D-020. LINZ Topo50 island polygons are the official land outline (CC-BY-4.0, 1:25k/1:50k, all 15 islands).
      PCRAFI ck_island has matching areas but is displaced by 1.6-8 km on Penrhyn, Pukapuka, Manihiki, Manuae,
      Rakahanga and Suwarrow (IoU < 0.15). Names: official island names (LINZ name points; Penrhyn alt
      Tongareva); PCRAFI iid recorded per island in the derive list for attribute joins.
    escalated: false
  - level_code: admin3
    chosen: cok-spc-sdd-phc2011-boundaries
    alternatives: [cok-spc-pcrafi-2010-exposure-boundaries]
    reason: "Same 2011 census geography; SDD copy is the NSO/SPC census release (CC-BY) with consistent attributes. Partial coverage (145 km2; 141.8 km2 on LINZ land): finest partition falls back to island."
    escalated: false
  - level_code: admin4
    chosen: cok-spc-sdd-phc2011-boundaries
    alternatives: [cok-spc-pcrafi-2010-exposure-boundaries]
    reason: "SDD 2011 EAs (134) are the census units; PCRAFI EA layer has 131 unlabelled filler polygons."
    escalated: false
  - level_code: other
    chosen: cok-spc-pcrafi-2010-exposure-boundaries
    alternatives: [cok-spc-pcrafi-aal-electoral, cok-osm-admin-relations]
    reason: >-
      Electoral constituencies (24, 2010): only source, now usable under the SPC agreement (D-020). The AAL
      copy is derived. Polygons cover reef/lagoon and carry the PCRAFI outer-island offsets (recommend clip
      to LINZ land in processing). No vaka/tapere polygons exist; current (post-2010) constituencies not found.
    escalated: false
