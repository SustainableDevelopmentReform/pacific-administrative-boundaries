            - {code: nassau, name: Nassau, lon: -165.415, lat: -11.559, group: northern, pcrafi_iid: 9}
            - {code: pukapuka, name: Pukapuka, lon: -165.853, lat: -10.879, group: northern, pcrafi_iid: 8}
