iso3: COK
country_name: Cook Islands
# Hierarchy (D-020, nz_realm_update 2026-11-20):
#   admin0 = union of admin2 islands (LINZ Topo50 island polygons, CC-BY-4.0; 240.7 km2)
#   admin1 = Group (3: Rarotonga, Southern, Northern) [region; no government of its own]
#            geometry dissolved from the LINZ islands; names and membership from PCRAFI ck_group/ck_island (gid 1/2/3)
#   admin2 = Island (15 incl. uninhabited Manuae, Takutea, Suwarrow; each inhabited island has an Island Government/Council)
#            geometry = LINZ island polygons split by island (layers 52251, 52293, 52203, 52222);
#            names = official island names (LINZ ISLD name points); PCRAFI iid recorded per island for joins
#   admin3 = Census District (44), 2011 census. PARTIAL coverage: covers only populated/coastal land
#            (e.g. Rarotonga CDs = 24 km2 of 67 km2); finest partition must fall back to island.
#   admin4 = Enumeration Area (134), 2011 census, also partial.
#   other  = Electoral constituency (24, 2010), non-nesting.
# Rarotonga vaka (Te Au O Tonga, Takitumu, Puaikura) and tapere: no polygon source found (searched PDH CKAN,
#   SPC GeoNode incl. PCRAFI/NC-SA layers, LINZ LDS, 2026-11-20).
sources:
  - source_id: cok-spc-sdd-phc2011-boundaries
    title: "2011 Cook Islands Population and Housing Census administrative boundaries (EA, census district)"
    publisher: "Pacific Community (SPC) Statistics for Development Division / Cook Islands Statistics Office"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2011_cok_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/2e650db6-5eb3-4c60-ac2c-4eb5c2d52193/resource/70805a7a-86de-4455-ac42-07307e85f7cd/download/2011_phc_cok_eaid_4326.geojson
      - https://pacificdata.org/data/dataset/2e650db6-5eb3-4c60-ac2c-4eb5c2d52193/resource/b46c3299-881e-4751-b23a-6fd6b7648179/download/2011_phc_cok_cd_4326.geojson
    retrieval_method: http
    license:
      name: CC-BY (Creative Commons Attribution; version unstated on PDH)
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH disclaimer: upper-level units may differ slightly from official boundaries; no endorsement implied."
    publication_date: 2020-06-26   # PDH record created; data = 2011 census geography
    version: "2011 PHC"
    format: geojson
    crs: EPSG:4326
    levels:
      - level_code: admin3
        level_type: statistical
        level_name_local: Census District
        layer: 2011_phc_cok_cd_4326.geojson
        name_field: {field: cd_name, case: title}
        code_field: cdid
        code_scheme: sdd-census
        parent_field: null     # [processing] SDD iid numbering matches no island code -> parent island by largest overlap
        nests: true
      - level_code: admin4
        level_type: statistical
        level_name_local: Enumeration Area
        layer: 2011_phc_cok_eaid_4326.geojson
        name_field: {field: ea_name, case: title}
        code_field: eaid
        code_scheme: sdd-census
        parent_field: cdid
        nests: true
    status: selected
    raw_path: data/raw/COK/cok-spc-sdd-phc2011-boundaries/
    notes: >-
      Official census geography (NSO via SPC PopGIS), open licence. Partial land coverage (CDs 145 km2,
      EAs 61 km2 vs ~240 km2 land): uninhabited interiors/islets are not in any unit. Census districts
      on Rarotonga approximate tapere groupings; on outer islands they are villages. 13 islands
      represented (no Manuae, Takutea). Lower-case names.

  - source_id: cok-spc-pcrafi-2010-exposure-boundaries
    title: "PCRAFI 2010 population exposure geographies, Cook Islands (Group, Island, Electoral Boundary, Census District, EA)"
    publisher: "Pacific Community (SPC) Geoscience, Energy and Maritime Division (PCRAFI); source PopGIS / Cook Islands Statistics Office"
    publisher_type: regional_body
    landing_url: https://geonode.pacificdata.org/catalogue/#/dataset/497
    download_urls:
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_group/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_group&outputFormat=SHAPE-ZIP&format_options=charset%3AUTF-8"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_group/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_group&outputFormat=json"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_island/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_island&outputFormat=SHAPE-ZIP&format_options=charset%3AUTF-8"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_island/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_island&outputFormat=json"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_electoral_boundary/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_electoral_boundary&outputFormat=SHAPE-ZIP&format_options=charset%3AUTF-8"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_electoral_boundary/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_electoral_boundary&outputFormat=json"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_census_district/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_census_district&outputFormat=SHAPE-ZIP&format_options=charset%3AUTF-8"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_census_district/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_census_district&outputFormat=json"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_enumeration_area/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_enumeration_area&outputFormat=SHAPE-ZIP&format_options=charset%3AUTF-8"
      - "https://geonode.pacificdata.org/geoserver/geonode/ck_enumeration_area/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ck_enumeration_area&outputFormat=json"
    retrieval_method: api
    license:
      name: CC-BY-NC-SA-4.0
      url: https://creativecommons.org/licenses/by-nc-sa/4.0/
      redistribution_ok: true
      agreement: "CSDR-SPC data use agreement (user-confirmed 2026-11-20)"
      notes: >-
        GeoNode dataset 497 itself says "Not Specified"; the PCRAFI collection on PDH is published under
        CC BY-NC-SA 4.0. Used and redistributed under the CSDR-SPC data use agreement (decision D-020).
    publication_date: 2020-02-03   # GeoNode publication date; data vintage 2010
    version: "PCRAFI 2010 exposure"
    format: geojson
    crs: EPSG:4326
    levels:
      - level_code: admin1
        level_type: region
        level_name_local: Group
        layer: ck_group.geojson
        name_field: group
        code_field: gid
        code_scheme: pcrafi
        parent_field: null
        nests: true
        use: false   # D-020: admin1 geometry = groups dissolved from LINZ islands; names/gid from this layer (see cok-linz-island-polygons-topo)
      - level_code: admin2
        level_type: island
        level_name_local: Island
        layer: ck_island.geojson
        name_field: iname
        code_field: iid
        code_scheme: pcrafi
        parent_field: gid
        nests: true
        use: false   # D-020: admin2 geometry = LINZ islands (this layer is offset up to 8 km on outer atolls); iid/iname joined via the LINZ derive list
      - level_code: other
        level_type: electoral
        level_name_local: Electoral Constituency
        layer: ck_electoral_boundary.geojson
        name_field: {field: elec_bound, case: title}
        code_field: ebid
        code_scheme: pcrafi
        layer_key: electoral
        parent_field: null
        nests: false
      - level_code: admin3
        level_type: statistical
        level_name_local: Census District
        layer: ck_census_district.geojson
        name_field: census_dis
        code_field: cdid
        parent_field: iid
        nests: true
        use: false   # admin3 selected from cok-spc-sdd-phc2011-boundaries
      - level_code: admin4
        level_type: statistical
        level_name_local: Enumeration Area
        layer: ck_enumeration_area.geojson
        name_field: enum_area
        code_field: eaid
        parent_field: iid
        nests: true
        use: false   # admin4 selected from cok-spc-sdd-phc2011-boundaries
    status: selected   # for other/electoral only (and group/island names+codes); admin1/admin2 geometry from LINZ, CD/EA from SDD
    raw_path: data/raw/COK/cok-spc-pcrafi-2010-exposure-boundaries/
    notes: >-
      Geography: Group(3), Island(15), Electoral Boundary(24), Census District(44), EA(247 of which 131 are
      eaid=0 filler polygons). Only full-coverage island layer found (15 islands, 244 km2). Abstract warns of
      attribute misalignment inherited from PopGIS; observed: ck_island Palmerston gid=2 but group='Northern';
      ck_electoral_boundary 'group' field wrong for some rows (e.g. TAKUVAINE-TUTAKIMOA 'Northern');
      ck_census_district Aitutaki cdid/geometry pairing differs from SDD 2011. Use names/geometry, verify
      attributes. Electoral boundaries are 2010; current (post-2010) constituency boundaries not found.
      Both SHAPE-ZIP and GeoJSON exports kept; GeoJSON preferred (untruncated field names).
      [nz_realm_update] ck_island vs LINZ Topo50 island polygons: areas agree (238.4 vs 240.7 km2) but outer
      islands are displaced (centroid offsets: Penrhyn 8.0 km, Pukapuka 4.6, Manihiki 4.1, Manuae 2.7,
      Rakahanga 1.7, Suwarrow 1.6 km; IoU < 0.15), Rarotonga/Mangaia/Mitiaro match (IoU >= 0.90). 'Mainihiki'
      misspelt. Electoral polygons extend over reef/lagoon (237.6 km2, of which 196.7 km2 on LINZ land) and
      inherit the same outer-island offsets; processing may clip them to LINZ land. No vaka/tapere layer on
      GeoNode/PDH.

