    chosen: fsm-spc-sdd-phc2010
    alternatives: [fsm-ocha-codab-2019, fsm-geoboundaries-gbopen, fsm-gadm-41]
    reason: "Official national census geography; COD-AB and geoBoundaries are derived copies of it."
