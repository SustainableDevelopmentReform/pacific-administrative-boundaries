decisions:
  - level_code: admin0
    chosen: niu-linz-island-polygons-topo
    alternatives: [niu-spc-sdd-phc2011-villages, niu-geoboundaries-gbopen, niu-gadm-41]
    reason: "D-020: LINZ Topo50 island polygon is the official NZ topographic land outline (CC-BY-4.0); census-village union agrees to IoU 0.995."
    escalated: false
  - level_code: admin1
    chosen: niu-spc-sdd-phc2011-villages
    alternatives: [niu-spc-pcrafi-aal-village, niu-geoboundaries-gbopen, niu-spc-sdd-coastal-2019-villages, niu-osm-admin-relations]
    reason: >-
      2011 census villages (14, CC-BY) match the 14 village councils / Assembly village constituencies
      (Alofi North and Alofi South separate) and are the newer official census geography. PCRAFI (2010, 13
      villages, Alofi unsplit; usable under the SPC agreement) has different internal lines (per-village IoU
      0.51-0.91) and only loss attributes; LINZ has no village polygons (13 name points only).
    escalated: false
