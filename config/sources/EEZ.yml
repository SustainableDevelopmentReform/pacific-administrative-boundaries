decisions:
  - level_code: eez
    chosen: spc-gem-pacific-eez-200nm
    alternatives: [marineregions-eez-v12]
    reason: >-
      User decision 2026-11-20 (D-019): SPC Pacific Maritime Boundaries polygons are the EEZ base
      (Pacific regional authority, built from national DOALOS deposits, more recent than MR v12),
      used under the CSDR-SPC data use agreement; downstream users are bound by CC BY-NC-SA 4.0
      unless they hold their own agreement. Supersedes the earlier escalated choice of
      marineregions-eez-v12. Marine Regions v12 (CC BY 4.0) is the alternative.
    escalated: false
  - level_code: eez
    chosen: spc-gem-pacific-eez-200nm
    alternatives: []
    reason: >-
      D-024: SPC polygons include land (no land holes; PNG 463k km2 of land, SLB/FJI/NCL/VUT
      12-27k km2). Ruling: land stays in the SPC polygons; no removal.
    escalated: false
  - level_code: eez
    chosen: marineregions-eez-v12
    alternatives: [spc-gem-pacific-eez-200nm]
    reason: >-
      D-025 Torres Strait: SPC has no joint-regime polygon (the zone sits in au_eez_pol feature 0,
      which shares MRGID 8323 with the Australian mainland). Marine Regions 21798 is used as a
      shared PNG row (POL_TYPE Joint regime); au_eez_pol feature 0 stays neighbour.
    escalated: false
  - level_code: eez
    chosen: marineregions-eez-v12
    alternatives: [spc-gem-pacific-eez-200nm]
    reason: >-
      D-025 Wake/Enenkio: SPC codes Wake as a plain US 200NM zone (kept with its published coding,
      relevance neighbour). Marine Regions 8319 (Overlapping claim) is used as the shared MHL;USA
      row per E-010.
    escalated: false
  - level_code: eez
    chosen: spc-gem-pacific-eez-200nm
    alternatives: []
    reason: >-
      D-025 FJI/WLF (11,957 km2 of MR-FJI in SPC WLF) and NIU/TON (3,241 km2 of MR-TON in SPC NIU)
      line differences vs MR v12: accepted as published by SPC; noted on the affected rows; no
      geometry change.
    escalated: false
