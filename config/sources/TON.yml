iso3: TON
country_name: Tonga
# Hierarchy (verified in ton_phc_2021_4326.gpkg):
#   admin1 Division (5) > admin2 District (23) > admin3 Village (167) > admin4 Census block (389) > admin5 Census unit (843)
#   other: Parliamentary constituency (17 People's Representative constituencies; nest within divisions, not within districts)
# Tonga has no elected local government; town/district officers are appointed per village/district.
sources:
  - source_id: ton-tsd-phc2021-admin-boundaries
    title: "2021 Tonga PHC administrative boundaries (divisions, districts, villages, constituencies, blocks, census units)"
    publisher: "SPC Statistics for Development Division (SDD) for Tonga Statistics Department"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2021_tonga_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/9f308944-01c1-4b36-bd18-00b05966b03b/resource/2b872e2c-efd1-4c2c-903e-83ecda5b45a3/download/ton_phc_2021_4326.gpkg
    retrieval_method: http
    license:
      name: CC-BY-4.0
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH licence field 'Creative Commons Attribution'. Official national census geography hosted by SPC (tier 1)."
    publication_date: 2025-03-06
    version: "2021 PHC"
    format: gpkg
    crs: EPSG:4326
    levels:
      - level_code: admin1
        level_type: region
        level_name_local: Division
        layer: ton_phc_2021_4326.gpkg::TON_DV_PHC2021_4326   # [processing] gpkg::layer form
        name_field: dv_name
        code_field: dvid
        code_scheme: tsd-census
        parent_field: null
        nests: true
        notes: "Layer carries leftover child attributes (vid, dsid, ...) from a dissolve; use dvid/dv_name only."
      - level_code: admin2
        level_type: district
        level_name_local: District
        layer: ton_phc_2021_4326.gpkg::TON_DID_PHC2021_4326   # [processing] gpkg::layer form
        name_field: ds_name
        code_field: dsid
        code_scheme: tsd-census
        parent_field: dvid
        nests: true
      - level_code: admin3
        level_type: ward_village
        level_name_local: Village
        layer: ton_phc_2021_4326.gpkg::TON_VID_PHC2021_4326   # [processing] gpkg::layer form
        name_field: v_name
        code_field: vid
        code_scheme: tsd-census
        parent_field: dsid
        nests: true
      - level_code: admin4
        level_type: statistical
        level_name_local: Census block
        layer: ton_phc_2021_4326.gpkg::TON_BLK_PHC2021_4326   # [processing] gpkg::layer form
        name_field: blk_2021
        code_field: blk_2021
        code_scheme: tsd-census
        parent_field: vid
        nests: true
      - level_code: admin5
        level_type: statistical
        level_name_local: Census unit
        layer: ton_phc_2021_4326.gpkg::TON_CU_PHC2021_4326   # [processing] gpkg::layer form
        name_field: cu_2021
        code_field: cu_2021
        code_scheme: tsd-census
        parent_field: blk_2021
        nests: true
      - level_code: other
        level_type: electoral
        level_name_local: Constituency (People's Representative)
        layer_key: constituency
        code_scheme: tsd-census
        layer: ton_phc_2021_4326.gpkg::TON_CON_PHC2021_4326   # [processing] gpkg::layer form
        name_field: con_name
        code_field: con_id
        parent_field: dvid
        nests: false
        notes: "17 constituencies; built from census blocks (con_id on blocks). Nest within divisions but cross districts."
    status: selected
    raw_path: data/raw/TON/ton-tsd-phc2021-admin-boundaries/
    notes: "Most recent official census geography (PHC 2021). Supersedes 2016/2011 PHC sets and the HDX COD-AB."
