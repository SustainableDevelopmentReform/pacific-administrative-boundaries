iso3: KIR
country_name: Kiribati
# Stack: Island group (3: Gilbert, Phoenix, Line; no government) > Island / island council (36 in
# COD-AB incl. uninhabited islands and Betio split from South Tarawa) > Village (183, 2018) >
# Enumeration area (391, 2018 household listing).
# Note: the SDD census "island" layers are 25 km coastal BUFFERS (display only), not land polygons.
sources:
  - source_id: kir-ocha-codab-2020
    title: "Kiribati - Subnational Administrative Boundaries (COD-AB) 2020"
    publisher: "OCHA Office of the Pacific Islands (HDX)"
    publisher_type: un_ocha
    landing_url: https://data.humdata.org/dataset/cod-ab-kir
    download_urls:
      - https://data.humdata.org/dataset/156a0966-1e09-455c-9e4f-e68676aa2fbf/resource/30c02bf1-d705-46ad-b828-b4b9bbed46e6/download/kir_adm_2020_shp.zip
      - https://data.humdata.org/dataset/156a0966-1e09-455c-9e4f-e68676aa2fbf/resource/e6759485-f662-4261-8e11-8184472a6ec8/download/kir_adm_2020_gdb.gdb.zip
      - https://data.humdata.org/dataset/156a0966-1e09-455c-9e4f-e68676aa2fbf/resource/135e3bac-64ed-405c-b360-3f80de9d2287/download/kir_admgz_2020.xlsx
    retrieval_method: http
    license:
      name: CC-BY-3.0-IGO
      url: http://creativecommons.org/licenses/by/3.0/igo/legalcode
      redistribution_ok: true
      notes: ""
    publication_date: 2020-01-13
    version: "2020 (reviewed Oct 2024, no update required)"
    format: shapefile
    crs: EPSG:4326
    levels:
      - level_code: admin0
        level_type: country
        level_name_local: Kiribati
        layer: kir_adm_2020_shp/kir_admbnda_adm0_2020.shp
        name_field: ADM0_EN
        code_field: ADM0_PCODE
        parent_field: null
        nests: true
      - level_code: admin1
        level_type: region
        level_name_local: Island group
        layer: kir_adm_2020_shp/kir_admbnda_adm1_2020.shp
        name_field: ADM1_EN
        code_field: ADM1_PCODE
        parent_field: ADM0_PCODE
        nests: true
      - level_code: admin2
        level_type: island
        level_name_local: Island (island council)
        layer: kir_adm_2020_shp/kir_admbnda_adm2_2020.shp
        name_field: ADM2_EN
        code_field: ADM2_PCODE
        parent_field: ADM1_PCODE
        nests: true
        notes: "36 units incl. uninhabited Phoenix/Line islands; Betio (KI124) separate from South Tarawa (KI107), matching Betio Town Council / Teinainano Urban Council."
    status: selected
    raw_path: data/raw/KIR/kir-ocha-codab-2020/
    notes: "HDX: 'Sourced from SPC SDD (kiribati.popgis.spc.int)'. i.e. DERIVED from the SDD census GIS but on land polygons (860 km2) and complete for all islands. Also shipped as FileGDB (kir_adm_2020_gdb.gdb, same content). kir_admbndl_ALL = shoreline lines (AdmLevel 99), not used."

  - source_id: kir-spc-sdd-hhl2018
    title: "2018 Kiribati Household Listing administrative boundaries (Island, Village, Enumeration Area)"
    publisher: "SPC Statistics for Development Division (SDD) for Kiribati National Statistics Office"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2018_kir_hhl_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/3d442365-5ee9-4dc2-bb50-a6780cc554cb/resource/cfb956da-2bb5-4984-ae58-679612a6d39b/download/2018_hhl_kir_eaid_3832.geojson
      - https://pacificdata.org/data/dataset/3d442365-5ee9-4dc2-bb50-a6780cc554cb/resource/9b8b6df7-3c89-41ae-84a9-bff823b125b4/download/2018_hhl_kir_vid_3832.geojson
      - https://pacificdata.org/data/dataset/3d442365-5ee9-4dc2-bb50-a6780cc554cb/resource/baac4740-cc6a-4a62-a5d0-b498fe12935a/download/2018_hhl_kir_iid_3832.geojson
    retrieval_method: http
    license:
      name: CC-BY-4.0
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH page states 'Creative Commons Attribution' (no version given)."
    publication_date: 2020-07-10   # PDH record created; data = 2018 household listing (DHS-MICS frame)
    version: "2018 HHL"
    format: geojson
    crs: EPSG:3832
    levels:
      - level_code: admin3
        level_type: ward_village
        level_name_local: Village
        layer: 2018_hhl_kir_vid_3832.geojson
        name_field: libgeo
        code_field: vid_2018
        code_scheme: sdd-census
        parent_field: null   # leading digits of vid_2018 = SDD island id (iid), not the COD P-code -> [processing] parent island by largest overlap (handles Betio)
        nests: true
      - level_code: admin4
        level_type: statistical
        level_name_local: Enumeration Area (2018 household listing)
        layer: 2018_hhl_kir_eaid_3832.geojson
        name_field: null
        code_field: east
        code_scheme: sdd-census
        parent_field: vid_2018   # [processing] code = zero-padded 'east' (ea_2018 drops the leading zero)
        nests: true
      - level_code: other
        level_type: island
        level_name_local: Island (25 km display buffer)
        layer: 2018_hhl_kir_iid_3832.geojson
        name_field: i_name
        code_field: iid
        parent_field: null
        nests: false
        use: false   # [processing] D-009: display buffers, never used as land
        notes: "Buffered display polygons (64,811 km2). Use only as a crosswalk SDD iid -> island name; do NOT use geometry."
    status: selected
    raw_path: data/raw/KIR/kir-spc-sdd-hhl2018/
    notes: "Official statistical geography (KNSO via SPC). Village and EA layers cover 630 km2 (inhabited islands only), so the 13 uninhabited COD islands fall back to admin2. Village/EA codes use the SDD island id (iid 1-23), which must be crosswalked to COD ADM2_PCODE (Betio villages lie inside COD KI124). East field 'east' has zero-padded codes; ea_2018 drops leading zero."

