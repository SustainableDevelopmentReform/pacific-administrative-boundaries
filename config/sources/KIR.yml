    title: "2010 Kiribati Population and Housing Census administrative boundaries (Island, Village, Enumeration Area)"
    publisher: "SPC Statistics for Development Division (SDD) for Kiribati National Statistics Office"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2010_kir_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/b0033b58-2c9b-4973-a732-27e391b7bd4c/resource/da5deb66-014b-4e71-87b0-a0a20b673c98/download/2010_phc_kir_eaid_3832.geojson
      - https://pacificdata.org/data/dataset/b0033b58-2c9b-4973-a732-27e391b7bd4c/resource/6ae2fdf3-9a58-4a8f-9598-1751db36ac44/download/2010_phc_kir_vid_3832.geojson
      - https://pacificdata.org/data/dataset/b0033b58-2c9b-4973-a732-27e391b7bd4c/resource/e7b09464-166c-4e81-a43b-09af89642997/download/2010_phc_kir_iidbuff_3832.geojson
    retrieval_method: http
    license:
      name: CC-BY-4.0
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH page states 'Creative Commons Attribution'."
    publication_date: 2020-06-29
    version: "2010 PHC"
    format: geojson
    crs: EPSG:3832
    levels:
      - {level_code: admin3, level_type: ward_village, level_name_local: Village, layer: 2010_phc_kir_vid_3832.geojson, name_field: v_name, code_field: vid, parent_field: null, nests: true}
      - {level_code: admin4, level_type: statistical, level_name_local: Enumeration Area (2010 census), layer: 2010_phc_kir_eaid_3832.geojson, name_field: ea_name, code_field: eaid, parent_field: null, nests: true}
    status: alternative
    raw_path: data/raw/KIR/kir-spc-sdd-phc2010/
    notes: "Superseded by 2018 HHL. Village/EA polygons cover only 70 km2 (settlement footprints, not full land). Island layer is a 25 km buffer (do not use)."

  - source_id: kir-geoboundaries-gbopen
    title: "geoBoundaries gbOpen KIR ADM0-ADM2"
    publisher: "geoBoundaries (William & Mary geoLab)"
    publisher_type: academic
    landing_url: https://www.geoboundaries.org/countryDownloads.html#KIR
    download_urls:
      - https://www.geoboundaries.org/api/current/gbOpen/KIR/ALL/
      - https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/KIR/ADM0/geoBoundaries-KIR-ADM0-all.zip
      - https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/KIR/ADM1/geoBoundaries-KIR-ADM1-all.zip
      - https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/KIR/ADM2/geoBoundaries-KIR-ADM2-all.zip
    retrieval_method: api
    license:
      name: ODbL-1.0
      url: https://opendatacommons.org/licenses/odbl/1-0/
      redistribution_ok: true
      notes: "All levels sourced from 'OpenStreetMap, Wambacher' under ODbL 1.0: share-alike, flag it."
    publication_date: 2023-12-12
    version: "gbOpen build 9469f09"
    format: geojson
    crs: EPSG:4326
    levels:
      - {level_code: admin0, level_type: country, level_name_local: Kiribati, layer: geoBoundaries-KIR-ADM0-all/geoBoundaries-KIR-ADM0.geojson, name_field: shapeName, code_field: shapeID, parent_field: null, nests: true}
      - {level_code: admin1, level_type: region, level_name_local: Island group, layer: geoBoundaries-KIR-ADM1-all/geoBoundaries-KIR-ADM1.geojson, name_field: shapeName, code_field: shapeISO, parent_field: null, nests: true}
      - {level_code: admin2, level_type: island, level_name_local: Island, layer: geoBoundaries-KIR-ADM2-all/geoBoundaries-KIR-ADM2.geojson, name_field: shapeName, code_field: shapeID, parent_field: null, nests: true}
    status: alternative
    raw_path: data/raw/KIR/kir-geoboundaries-gbopen/
    notes: "OSM-derived (24 ADM2 units). Lower tier than COD-AB; ODbL."

  - source_id: kir-spc-gem-island-aal
    title: "Annual Average Loss from Tropical Cyclones and Earthquakes for Kiribati (island)"
    publisher: "SPC Geoscience, Energy and Maritime Division (GEM)"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/ki-island-aal-tc-eq-1751
    download_urls:
      - https://geonode.pacificdata.org/geoserver/geonode/ki_island_aal_tc_eq/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:ki_island_aal_tc_eq&outputFormat=json&content-disposition=attachment
    retrieval_method: api
    license: {name: CC-BY-NC-SA-4.0, url: "https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode", redistribution_ok: false, notes: "Non-commercial, share-alike."}
    publication_date: 2025-10-14
    version: "PCRAFI AAL layer"
    format: geojson
    crs: EPSG:4326
    levels:
      - {level_code: admin2, level_type: island, level_name_local: Island, layer: ki_island_aal_tc_eq.geojson, name_field: island, code_field: iid, parent_field: gid, nests: true}
    status: rejected
    raw_path: data/raw/KIR/kir-spc-gem-island-aal/
