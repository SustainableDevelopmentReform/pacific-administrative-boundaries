    version: "4.1"
    format: gpkg
    crs: EPSG:4326
    levels:
      - {level_code: admin0, level_type: country, level_name_local: Kiribati, layer: ADM_ADM_0, name_field: COUNTRY, code_field: GID_0, parent_field: null, nests: true}
    status: reference
    raw_path: data/raw/KIR/kir-gadm-41/
