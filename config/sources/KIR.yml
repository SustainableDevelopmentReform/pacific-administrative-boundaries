decisions:
  - level_code: admin1
    chosen: kir-ocha-codab-2020
    alternatives: [kir-geoboundaries-gbopen]
    reason: "No national layer for island groups; COD-AB (tier 2, from SPC SDD) beats OSM-derived geoBoundaries."
    escalated: false
  - level_code: admin2
    chosen: kir-ocha-codab-2020
    alternatives: [kir-spc-sdd-hhl2018, kir-spc-sdd-phc2010, kir-geoboundaries-gbopen, kir-spc-gem-island-aal]
    reason: "The tier-1 SDD island layers are 25 km display buffers, not land; COD-AB is derived from SDD on land polygons, covers all 36 islands and separates Betio."
    escalated: false
  - level_code: admin3
    chosen: kir-spc-sdd-hhl2018
    alternatives: [kir-spc-sdd-phc2010]
    reason: "Official; most recent (2018 vs 2010); covers full inhabited land rather than settlement footprints."
    escalated: false
  - level_code: admin4
    chosen: kir-spc-sdd-hhl2018
    alternatives: [kir-spc-sdd-phc2010]
    reason: "Most recent official EA frame (2018). 2020 census EAs not published."
    escalated: false
