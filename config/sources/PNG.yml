# Source register for Papua New Guinea. Written by the retrieval stage (Melanesia agent), 2026-11-20.
# Hierarchy: Region (4, not an official administrative division) > Province (20 + NCD + AROB = 22)
#            > District (87, 2011-census set) > Local Level Government (326) > Ward (not public).
# Note: PNG created further districts/open electorates in 2022 (96 open electorates); no public polygons found.
iso3: PNG
country_name: Papua New Guinea
sources:
  - source_id: png-ocha-cod-ab-2019
    title: "Papua New Guinea - Subnational Administrative Boundaries (COD-AB) adm0-3, v01"
    publisher: "OCHA (HDX); source Papua New Guinea National Statistics Office; contributed by OCHA ROAP"
    publisher_type: un_ocha
    landing_url: https://data.humdata.org/dataset/cod-ab-png
    download_urls:
      - https://data.humdata.org/dataset/f260301d-c32f-4e9e-a7d6-05bde2f70b6b/resource/156e393b-1a62-46dd-a7af-e915c750a967/download/png_admin_boundaries.gdb.zip
      - https://data.humdata.org/dataset/f260301d-c32f-4e9e-a7d6-05bde2f70b6b/resource/c0386530-3455-45b4-b413-f41ccbdd2215/download/png_admin_boundaries.shp.zip
