    retrieval_method: http
    license:
      name: CC-BY-3.0-IGO
      url: http://creativecommons.org/licenses/by/3.0/igo/legalcode
      redistribution_ok: true
      notes: ""
    publication_date: 2019-05-10
    version: "v01 (valid_on 2019-05-08; reviewed 2025-10-30; files regenerated 2026-01-26)"
    format: other  # Esri FileGDB (shapefile copy also present)
    crs: EPSG:4326
    levels:
      - {level_code: admin0, level_type: country, level_name_local: Country, layer: "extracted/png_admin_boundaries.gdb/png_admin_boundaries.gdb::png_admin0", name_field: adm0_name, code_field: adm0_pcode, parent_field: null, nests: true}
      - {level_code: admin2, level_type: state_province, level_name_local: "Province / Autonomous Region / National Capital District", layer: "extracted/png_admin_boundaries.gdb/png_admin_boundaries.gdb::png_admin1", name_field: adm1_name, code_field: adm1_pcode, parent_field: adm0_pcode, nests: true, notes: "COD adm1 = our admin2 because Regions are inserted as admin1. Region membership must be joined (by province) from png-nso-regions-2015."}
