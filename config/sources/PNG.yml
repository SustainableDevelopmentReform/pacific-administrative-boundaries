    status: selected
    raw_path: data/raw/PNG/png-ocha-cod-ab-2019/
    derived_from: [png-nso-census2011-boundaries]
    notes: "Format is FileGDB (layer given as <gdb>::<layer>); shapefile copy also extracted under extracted/png_admin_boundaries.shp/. Geometry matches the NSO 2011 census set (same counts 22/87/326, vertex totals within 0.1%, area equal): treat as the openly licensed release of the NSO boundaries. Also has adminlines and adminpoints layers (not needed)."

