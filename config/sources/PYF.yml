decisions:
- level_code: admin2
  chosen: pyf-daf-geographie-administrative-2022
  alternatives:
  - pyf-ispf-limites-administratives-2022
  reason: 'Two official territorial sources (tier 1) with materially different geometry. ISPF is the most
    recent upload (2022-06-10 vs 2022-02-28) so selected per rule, but DAF is the cadastral authority,
    is CC-BY (ISPF is ODbL share-alike) and carries INSEE codes. Recommend orchestrator choose DAF. ORCHESTRATOR
    RULING E-004: DAF chosen. Three-month upload gap is not a meaningful recency difference; DAF is the
    cadastral authority, carries INSEE codes and is CC-BY (no share-alike).'
  escalated: false
  resolved_by: orchestrator E-004 2026-11-20
- level_code: admin3
  chosen: pyf-daf-geographie-administrative-2022
  alternatives:
  - pyf-ispf-limites-administratives-2022
  reason: 'Same clash as admin2 (communes associees). ORCHESTRATOR RULING E-004: DAF chosen. Three-month
    upload gap is not a meaningful recency difference; DAF is the cadastral authority, carries INSEE codes
    and is CC-BY (no share-alike).'
  escalated: false
  resolved_by: orchestrator E-004 2026-11-20
- level_code: admin1
  chosen: pyf-daf-geographie-administrative-2022
  alternatives:
  - pyf-ispf-limites-administratives-2022
  - pyf-gadm41
  reason: 'Derived by dissolving the selected admin2; follows the admin2 decision. ORCHESTRATOR RULING
    E-004: DAF chosen. Three-month upload gap is not a meaningful recency difference; DAF is the cadastral
    authority, carries INSEE codes and is CC-BY (no share-alike).'
  escalated: false
  resolved_by: orchestrator E-004 2026-11-20
