# Source register for Solomon Islands. Written by the retrieval stage (Melanesia agent), 2026-11-20.
# Census hierarchy (SINSO 2009): Province (9 + Honiara Capital Territory = 10) > Constituency (50) > Ward (183) > EA (1,344).
# Constituencies are national-parliament electoral units but nest strictly in this geography, so they are admin2.
iso3: SLB
country_name: Solomon Islands
sources:
  - source_id: slb-sdd-phc2009-boundaries
    title: "2009 Solomon Islands Population and Housing Census admin boundaries (Province, Constituency, Ward, EA)"
    publisher: "SPC Statistics for Development Division (SDD) for Solomon Islands National Statistics Office (Pacific Data Hub)"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2009_slb_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/e8be9308-8edc-4bfb-b6a9-0dd5588efc98/resource/8b6bc4e2-17da-4ace-9a6c-7ea186e1dd42/download/2009_phc_slb_pid_4326.geojson
      - https://pacificdata.org/data/dataset/e8be9308-8edc-4bfb-b6a9-0dd5588efc98/resource/00bdccf0-7384-42b1-b9b2-a3f77eff2d20/download/2009_phc_slb_coid2_4326.geojson
