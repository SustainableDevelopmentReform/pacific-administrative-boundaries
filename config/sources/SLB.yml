      - {level_code: admin3, level_type: ward_village, level_name_local: Ward, layer: 2009_phc_slb_wid_4326.geojson, name_field: WName, code_field: WID, code_scheme: sdd-census, parent_field: coid, nests: true, notes: "Internal layer name is mislabelled '2009_PHC_SLB_coid_4326'; content is 183 wards."}
      - {level_code: admin4, level_type: statistical, level_name_local: Enumeration Area, layer: 2009_phc_slb_eaid_4326.geojson, name_field: EAName, code_field: EAID, code_scheme: sdd-census, parent_field: wid, nests: true}
    status: selected
    raw_path: data/raw/SLB/slb-sdd-phc2009-boundaries/
    derived_from: []
    notes: "Tier 1 census geography. Ward geometry is identical to COD-AB adm3 and geoBoundaries ADM3 (same vertex count and area), so those are copies."

