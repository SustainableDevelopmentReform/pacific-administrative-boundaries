    retrieval_method: http
    license:
      name: CC-BY-4.0
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH licence 'cc-by' (version unstated). Disclaimer: upper-level units may slightly differ from official boundaries; no endorsement by SPC."
    publication_date: 2020-06-29
    version: "2009 PHC"
    format: geojson
    crs: EPSG:4326
    levels:
      - {level_code: admin1, level_type: state_province, level_name_local: "Province (incl. Honiara Capital Territory)", layer: 2009_phc_slb_pid_4326.geojson, name_field: PName, code_field: PID, code_scheme: sdd-census, parent_field: null, nests: true}
