# Source register for New Caledonia. Written by the retrieval stage (Melanesia agent), 2026-11-20.
# Hierarchy: Province (3) > Commune (33, INSEE code_com 988xx) > [Noumea only: quartiers (37)].
# Poya commune straddles Province Nord (~559 km2) and Province Sud (~281 km2): split it by province during processing
# (GADM does the same, hence its 35 ADM2 units). Aires coutumieres (8) are customary and non-nesting.
# IGN ADMIN EXPRESS covers metropolitan France + DROM only, not New Caledonia (checked data.gouv.fr description).
iso3: NCL
country_name: New Caledonia
sources:
  - source_id: ncl-gnc-limites-terrestres-2024
