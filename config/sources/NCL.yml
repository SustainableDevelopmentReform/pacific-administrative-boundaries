    publication_date: 2024-10-28
    version: "update 2024-10-28 (item modified 2026-07-17)"
    format: shapefile
    crs: EPSG:3163
    levels:
      - {level_code: admin1, level_type: state_province, level_name_local: Province, layer: extracted/limites_terrestres_layer1_provinces/Provinces.shp, name_field: {field: nom_fichie, map: {PROVINCE_NORD: Province Nord, PROVINCE_SUD: Province Sud, PROVINCE_DES_ILES: Province des Îles Loyauté}}, code_field: {field: nom_fichie, map: {PROVINCE_NORD: nord, PROVINCE_SUD: sud, PROVINCE_DES_ILES: iles}}, code_scheme: name-slug, parent_field: null, nests: true, notes: "[processing] codes nord/sud/iles, official names. No code; use nom_fichie (PROVINCE_NORD, PROVINCE_SUD, PROVINCE_DES_ILES) or generate."}
