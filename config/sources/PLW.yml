decisions:
  - level_code: admin1
    chosen: plw-spc-sdd-phc2015
    alternatives: [plw-palaris-political-2016, plw-geoboundaries-gbopen, plw-spc-gem-state-aal, plw-gadm-41]
    reason: "Two tier-1 sources: SDD 2015 census states (statistics office; codes; nest exactly with hamlets/EAs) vs PALARIS (lands GIS office; no codes; served 2016 but data date unknown, so recency cannot be established). Chose SDD for nesting consistency; geometry differs slightly (455.7 vs 460.3 km2). SDD has two state-name errors to fix."
    escalated: true
  - level_code: admin2
    chosen: plw-spc-sdd-phc2015
    alternatives: [plw-geoboundaries-gbopen]
    reason: "Only official hamlet layer; geoBoundaries ADM2 is a copy."
    escalated: false
  - level_code: admin3
    chosen: plw-spc-sdd-phc2015
    alternatives: []
    reason: "Only EA layer (2015). 2020/2025 census EAs not published."
    escalated: false
