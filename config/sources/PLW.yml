iso3: PLW
country_name: Palau
# Stack: State (16) > Hamlet (77) > 2015 census Enumeration Area (141).
# Census 'group of states' (7) is a statistical grouping, kept as non-nesting 'other'.
# House of Delegates constituencies = the 16 states; Senate is elected at large (no layer needed).
sources:
  - source_id: plw-spc-sdd-phc2015
    title: "2015 Palau Population and Housing Census administrative boundaries (Group of States, State, Hamlet, Enumeration Area)"
    publisher: "SPC Statistics for Development Division (SDD) for Palau Office of Planning and Statistics"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2015_plw_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/720db74a-1add-45dd-a442-e852b2ca6f21/resource/92304f02-a4fe-4750-98b7-3a0a216b0d32/download/2015_phc_plw_eaid_4326.geojson
      - https://pacificdata.org/data/dataset/720db74a-1add-45dd-a442-e852b2ca6f21/resource/fe6dd29b-6ec5-4a06-9aac-e8d84d895b21/download/2015_phc_plw_hid_4326.geojson
      - https://pacificdata.org/data/dataset/720db74a-1add-45dd-a442-e852b2ca6f21/resource/de0f3f73-1170-4634-8d34-d4b107ff3a18/download/2015_phc_plw_sid_4326.geojson
      - https://pacificdata.org/data/dataset/720db74a-1add-45dd-a442-e852b2ca6f21/resource/f99b62ee-368f-4aa5-b4d9-d84fc6285623/download/2015_phc_plw_gsid_4326.geojson
    retrieval_method: http
    license: {name: CC-BY-4.0, url: "http://www.opendefinition.org/licenses/cc-by", redistribution_ok: true, notes: "PDH page states 'Creative Commons Attribution'."}
    publication_date: 2020-06-29   # PDH record created; data = 2015 census frame
    version: "2015 PHC"
    format: geojson
    crs: EPSG:4326
    levels:
      - {level_code: admin0, level_type: country, level_name_local: Republic of Palau, layer: 2015_phc_plw_sid_4326.geojson, name_field: null, code_field: null, parent_field: null, nests: true, use: false, notes: "Dissolve states. [processing] use: false -> dissolved by the pipeline."}
      - level_code: admin1
        level_type: state_province
        level_name_local: State
        layer: 2015_phc_plw_sid_4326.geojson
        name_field: sname
        code_field: sid
        code_scheme: sdd-census
        parent_field: null
        name_map: {6: Koror, 9: Ngarchelong}   # [processing] E-003 name corrections
        nests: true
        notes: "DATA ERRORS to fix in processing: sid 6 named 'Koro' (= Koror); sid 9 named 'Ngaraard' (duplicate of sid 8; sid 9 = Ngarchelong per PALARIS/GADM)."
      - level_code: admin2
        level_type: ward_village
        level_name_local: Hamlet
        layer: 2015_phc_plw_hid_4326.geojson
        name_field: hname
        code_field: hid
        code_scheme: sdd-census
        parent_field: {field: hid, floordiv: 100}   # hid = sid * 100 + n (e.g. 101 -> state 1)
        nests: true
      - level_code: admin3
        level_type: statistical
        level_name_local: Enumeration Area (2015 census)
        layer: 2015_phc_plw_eaid_4326.geojson
        name_field: eaname
        code_field: eaid
        code_scheme: sdd-census
        parent_field: {field: eaid, floordiv: 100}   # eaid = hid * 100 + n (e.g. 140101 -> hamlet 1401)
        nests: true
      - level_code: other
        level_type: region
        level_name_local: Group of states (census)
        layer: 2015_phc_plw_gsid_4326.geojson
        name_field: gsname
        code_field: gsid
        code_scheme: sdd-census
        layer_key: state-group
        parent_field: null
        nests: false
        notes: "7 groups; gsid not unique (4 used for both Hatohobei and West Babeldaob)."
    status: selected
    raw_path: data/raw/PLW/plw-spc-sdd-phc2015/
    notes: "Official census geography; all four layers share the same 455.7 km2 extent and nest exactly. geoBoundaries PLW ADM2 is a copy of the hamlet layer."

