    title: "Political Boundaries - Palau (PALARIS, served by PacIOOS)"
    publisher: "Palau Automated Land and Resources Information System (PALARIS), distributed by PacIOOS"
    publisher_type: national
    landing_url: https://www.pacioos.hawaii.edu/metadata/pw_plrs_all_political_bndry.html
    download_urls:
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_all_political_bndry&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_all_political_bndry&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_all_political_bndry_line&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_all_political_bndry_line&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_hato_bndry&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_hato_bndry&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_sons_bndry&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_sons_bndry&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_ngar_bndry&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:pw_plrs_ngar_bndry&outputFormat=SHAPE-ZIP
    retrieval_method: api
    license:
      name: "PacIOOS data use (free use and redistribution, not for legal use)"
      url: https://www.pacioos.hawaii.edu/metadata/pw_plrs_all_political_bndry.html
      redistribution_ok: true
      notes: "'The data may be used and redistributed for free but is not intended for legal use, since it may contain inaccuracies.' data.gov lists the same PALARIS record as public domain."
    publication_date: 2016-01-25   # PacIOOS service date; PALARIS data date not stated
    version: ""
    format: geojson
    crs: "EPSG:32653 (all_political_bndry, _line, ngar GeoJSON as served); EPSG:4326 (hato, sons)"
    levels:
      - level_code: admin1
        level_type: state_province
        level_name_local: State
        layer: pw_plrs_all_political_bndry.geojson
        name_field: state
        code_field: null
        parent_field: null
        nests: true
        notes: "750 island-part polygons with a state attribute (dissolve on 'state' -> 16). 460.3 km2."
      - level_code: other
        level_type: island
        level_name_local: Island (Sonsorol / Hatohobei Southwest Islands)
        layer: pw_plrs_sons_bndry.geojson
        name_field: is_name
        code_field: null
        parent_field: state
        nests: false
        notes: "Plus pw_plrs_hato_bndry.geojson (Tobi, Helen Reef). Ngaremeduu boundary (pw_plrs_ngar_bndry) is a conservation-area line, not administrative."
    status: alternative
    raw_path: data/raw/PLW/plw-palaris-political-2016/
    notes: "National lands GIS office (tier 1). No codes; does not carry hamlets. GeoJSON from WFS 1.0.0 retains native UTM 53N for some layers (CRS stated in file)."

