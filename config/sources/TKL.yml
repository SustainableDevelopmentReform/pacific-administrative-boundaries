decisions:
  - level_code: admin0
    chosen: tkl-linz-island-polygons-topo
    alternatives: [tkl-geoboundaries-gbopen, tkl-gadm-41]
    reason: "D-020: dissolve of the LINZ 1:25k islet outlines (official NZ topographic data, CC-BY-4.0, 8.97 km2); geoBoundaries (Sentinel-2, 9.81 km2) and GADM (15.7 km2, restricted) are coarser."
    escalated: false
  - level_code: admin1
    chosen: tkl-linz-island-polygons-topo
    alternatives: [tkl-geoboundaries-gbopen, tkl-osm-admin-relations, tkl-gadm-41]
    reason: >-
      D-020: LINZ islets split by atoll (unambiguous: atolls 60-90 km apart). No SPC/PCRAFI/census atoll or
      village polygons exist; OSM atolls are maritime; GADM restricted and coarse (IoU 0.51-0.60 with LINZ).
      Atoll = village (Taupulega); no lower village level published.
    escalated: false
