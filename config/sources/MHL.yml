iso3: MHL
country_name: Marshall Islands
# Stack: Atoll / island local government (25 in COD-AB incl. Kili/Jabat/Mejit islands) >
# 2021 census Enumeration Area (152). Ratak/Ralik chains are not published as polygons (derivable
# by grouping atolls). Village polygons exist only for 8 atolls (USAID via PacIOOS).
# Nitijela electoral districts (24) coincide with atolls/islands; no separate layer.
sources:
  - source_id: mhl-ocha-codab-2021
    title: "Marshall Islands - Subnational Administrative Boundaries (COD-AB), 2021 census geography"
    publisher: "OCHA Regional Office for Asia and the Pacific (HDX)"
    publisher_type: un_ocha
    landing_url: https://data.humdata.org/dataset/cod-ab-mhl
    download_urls:
      - https://data.humdata.org/dataset/c215706c-9c22-43ca-8d36-9de4726eb9e0/resource/383a9368-998f-4657-a380-6323bb827296/download/mhl_admbnda_wgs84_ab_shp.zip
      - https://data.humdata.org/dataset/c215706c-9c22-43ca-8d36-9de4726eb9e0/resource/43245500-83c5-41a3-b1a6-713e532067a8/download/mhl_admbnda_wgs84_ab_gdb.gdb.zip
      - https://data.humdata.org/dataset/c215706c-9c22-43ca-8d36-9de4726eb9e0/resource/f7db4038-975c-4a18-a3aa-0ae5aa6fa6e7/download/mhl_admgz.xls
    retrieval_method: http
    license:
      name: CC-BY-3.0-IGO
      url: http://creativecommons.org/licenses/by/3.0/igo/legalcode
      redistribution_ok: true
      notes: ""
    publication_date: 2024-11-19   # HDX resources updated; dataset date 2021-01-01
    version: "2021 (reviewed Oct 2024)"
    format: shapefile
    crs: EPSG:4326
    levels:
      - level_code: admin0
        level_type: country
        level_name_local: Republic of the Marshall Islands
        layer: mhl_admbnda_wgs84_ab_shp/mhl_admbnda_wgs84_adm0.shp
        name_field: ADM0_EN
        code_field: ADM0_PCODE
        parent_field: null
        nests: true
      - level_code: admin1
        level_type: island
        level_name_local: Atoll / Island (local government)
        layer: mhl_admbnda_wgs84_ab_shp/mhl_admbnda_wgs84_adm1.shp
        name_field: ADM1_EN
        code_field: ADM1_PCODE
        parent_field: ADM0_PCODE
        nests: true
      - level_code: admin2
        level_type: statistical
        level_name_local: Enumeration Area (2021 census)
        layer: mhl_admbnda_wgs84_ab_shp/mhl_admbnda_wgs84_adm2.shp
        name_field: ADM2_EN
        code_field: ADM2_PCODE
        parent_field: ADM1_PCODE
        nests: true
        notes: "HDX caveat: polygon MH0609 (present in COD-PS) is missing."
    status: selected
    raw_path: data/raw/MHL/mhl-ocha-codab-2021/
    notes: "HDX: 'Sourced from SPC SDD' (2021 census GIS, EPPSO). Land polygons, 106 km2, all layers same extent. FileGDB copy in mhl_admbnda_wgs84_ab_gdb.gdb (nested .gdb; layers mhl_admbnda_adm0, mhl_admbnda_adm1_atolls, mhl_admbnda_adm2_EA). HDX warns its geoservices are mis-scaled; the files are fine."

