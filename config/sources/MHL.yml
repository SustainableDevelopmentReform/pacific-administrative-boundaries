decisions:
  - level_code: admin1
    chosen: mhl-ocha-codab-2021
    alternatives: [mhl-spc-sdd-atollpop2011, mhl-geoboundaries-gbopen, mhl-usaid-pacioos-lga-2017, mhl-spc-gem-atoll-aal, mhl-gadm-41]
    reason: "COD-AB carries the 2021 census geography from SPC SDD/EPPSO (most recent official). SDD 2011 atolls are older; SDD 2011 atoll buffer layer is display-only."
    escalated: false
  - level_code: admin2
    chosen: mhl-ocha-codab-2021
    alternatives: [mhl-spc-sdd-phc2011]
    reason: "2021 census EAs (most recent) vs 2011 EAs; both from SDD/EPPSO."
    escalated: false
  - level_code: other
    chosen: mhl-usaid-pacioos-lga-2017
    alternatives: []
    reason: "Only village polygons available (8 atolls, partial); non-nesting."
    escalated: false
