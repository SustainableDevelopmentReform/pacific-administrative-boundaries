      - https://pacificdata.org/data/dataset/3a74d05c-099e-4b89-bc8c-e6047fddeb48/resource/cc0763ac-6f4a-4837-9100-50da3f1d0bc3/download/rmi_atol_pop_2011.kml
      - https://pacificdata.org/data/dataset/3a74d05c-099e-4b89-bc8c-e6047fddeb48/resource/6661ae45-39b9-4e61-a35d-5adb8a13e0a4/download/rmi_atol_pop_2011.zip
