  - source_id: mhl-usaid-pacioos-lga-2017
    title: "Marshall Islands Local Government Areas, Village Boundaries and Atolls (USAID, served by PacIOOS)"
    publisher: "PacIOOS (data provider: U.S. Agency for International Development)"
    publisher_type: other
    landing_url: https://www.pacioos.hawaii.edu/metadata/mh_mgd_all_local_gov_areas.html
    download_urls:
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_local_gov_areas&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_local_gov_areas&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_villages&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_villages&outputFormat=SHAPE-ZIP
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_atolls&outputFormat=application/json
      - https://geo.pacioos.hawaii.edu/geoserver/PACIOOS/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=PACIOOS:mh_mgd_all_atolls&outputFormat=SHAPE-ZIP
    retrieval_method: api
    license:
      name: "PacIOOS data use (free use and redistribution, not for legal use)"
      url: https://www.pacioos.hawaii.edu/metadata/mh_mgd_all_local_gov_areas.html
      redistribution_ok: true
      notes: "'The data may be used and redistributed for free but is not intended for legal use, since it may contain inaccuracies.'"
    publication_date: 2017-04-19   # PacIOOS service date; underlying data older (atolls carry 1999 census attributes)
    version: ""
    format: geojson
    crs: EPSG:4326
    levels:
      - level_code: other
        level_type: ward_village
        level_name_local: Village
        layer: mh_mgd_all_villages.geojson
        layer_key: village-usaid
        name_field: BryanName
        code_field: {template: "{Atoll}-{LandID}{VillageID}"}   # [processing] composite code
        code_scheme: usaid-composite
        parent_field: Atoll
        nests: false
        notes: "49 village polygons on 8 atolls only (Majuro, Arno, Maloelap, Mejit, ...), 29.6 km2. Partial coverage."
      - level_code: other
        level_type: local_government
        level_name_local: Local Government Area (incl. lagoon/marine)
        layer: mh_mgd_all_local_gov_areas.geojson
        name_field: Atoll
        code_field: null
        parent_field: null
        nests: false
        use: false   # [processing] marine jurisdiction extents, not land units; decision for `other` names villages only
        notes: "30 polygons / 26 names covering 48,240 km2 (marine jurisdiction areas around atolls), not land units."
    status: alternative
    raw_path: data/raw/MHL/mhl-usaid-pacioos-lga-2017/
    notes: "Only open source for MHL village polygons (partial). Atolls layer (33 polygons incl. lagoons, 1999 census attributes) kept for reference. Each layer has a _metadata.html and both GeoJSON (EPSG:4326) and SHAPE-ZIP copies."

