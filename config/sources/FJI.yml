      - {level_code: admin3, level_type: district, level_name_local: Tikina, layer: extracted/fji_polbnda_adm3_tikina/fji_polbnda_adm3_tikina.shp, name_field: ADM3_NAME, code_field: ADM3_PCODE, parent_field: ADM2_PCODE, nests: true}
    status: alternative
    raw_path: data/raw/FJI/fji-ocha-cod-ab-2017/
    derived_from: []
    notes: "Tier 2, endorsed COD; same FBoS 2017 lineage as SDD but different geometry. Carries P-codes and FBoS IDs. Use the shapefiles (projected; reproject) - gdb lacks a CRS. Strong candidate if the orchestrator prefers the endorsed COD for admin1-3."

