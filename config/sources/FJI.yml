decisions:
  - level_code: admin0
    chosen: fji-sdd-phc2017-boundaries
    alternatives: [fji-ocha-cod-ab-2017, fji-geoboundaries-adm0, fji-gadm-4-1]
    reason: "Derive from the union of the SDD 2017 provinces (consistent with admin1-4). Note Fiji straddles the antimeridian."
    escalated: false
  - level_code: admin1
    chosen: fji-sdd-phc2017-boundaries
    alternatives: [fji-ocha-cod-ab-2017, fji-gadm-4-1, fji-geoboundaries-adm1]
    reason: "Divisions dissolved from SDD 2017 tikina (tier 1, consistent with admin2-4). COD-AB has a ready Division layer with P-codes but different geometry."
    escalated: true
  - level_code: admin2
    chosen: fji-sdd-phc2017-boundaries
    alternatives: [fji-ocha-cod-ab-2017, fji-sdd-phc2007-boundaries, fji-geoboundaries-adm2, fji-gadm-4-1]
    reason: "SDD 2017 (FBoS census geography, tier 1, published 2020) vs COD-AB (tier 2 but OCHA/ITOS-endorsed, same FBoS 2017 lineage, published 2018). SDD carries a disclaimer that upper-level units may differ from official boundaries; geometries differ materially (~2.6% total area). Picked most recent / higher tier; escalated because officialness is ambiguous."
    escalated: true
  - level_code: admin3
    chosen: fji-sdd-phc2017-boundaries
    alternatives: [fji-ocha-cod-ab-2017, fji-sdd-phc2007-boundaries, fji-geoboundaries-adm3]
    reason: "As admin2 (same pair of sources, 86 tikina each)."
    escalated: true
  - level_code: admin4
    chosen: fji-sdd-phc2017-boundaries
    alternatives: [fji-sdd-phc2007-boundaries, fji-geoboundaries-adm4]
    reason: "Only 2017 EA source; 2007 EAs superseded."
    escalated: false
