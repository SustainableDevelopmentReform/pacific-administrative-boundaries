# Source register for Fiji. Written by the retrieval stage (Melanesia agent), 2026-11-20.
# Paths in `layer` are relative to `raw_path`.
iso3: FJI
country_name: Fiji
sources:
  - source_id: fji-sdd-phc2017-boundaries
    title: "2017 Fiji Population and Housing Census admin boundaries (Province, Tikina, Enumeration Areas)"
    publisher: "SPC Statistics for Development Division (SDD) for Fiji Bureau of Statistics (Pacific Data Hub)"
    publisher_type: regional_body
    landing_url: https://pacificdata.org/data/dataset/2017_fji_phc_admin_boundaries
    download_urls:
      - https://pacificdata.org/data/dataset/f45cd559-7350-4362-91ad-0c922853fb5c/resource/0d2bdd5b-9c28-47fd-9dd8-2917daeb276d/download/2017_phc_fji_pid_4326.geojson
      - https://pacificdata.org/data/dataset/f45cd559-7350-4362-91ad-0c922853fb5c/resource/aaddfae8-7d6d-482c-9c9b-dc2daf3ad250/download/2017_phc_fji_tid_4326.geojson
      - https://pacificdata.org/data/dataset/f45cd559-7350-4362-91ad-0c922853fb5c/resource/6a8622f8-3d7c-4af2-9548-7c4278e49114/download/2017_phc_fji_eaid_4326.geojson
    retrieval_method: http
    license:
      name: CC-BY-4.0
      url: http://www.opendefinition.org/licenses/cc-by
      redistribution_ok: true
      notes: "PDH lists licence_id 'cc-by' (Creative Commons Attribution, version not stated; treated as CC BY 4.0). PDH disclaimer: 'Upper level administrative units may slightly differ from the official boundaries. The boundaries, codes and names shown in the datasets do not imply official endorsement or acceptance by SPC.'"
    publication_date: 2020-06-26
    version: "2017 PHC"
    format: geojson
    crs: EPSG:4326
    levels:
      - level_code: admin1
        level_type: region   # [processing] D-018: commissioner-administered grouping of provinces
        level_name_local: Division
        layer: 2017_phc_fji_tid_4326.geojson
        name_field: Division
        code_field: {field: Division, case: lower}
        code_scheme: name-slug
        parent_field: null
        dissolve: true
        nests: true
        notes: "[processing] dissolve on Division made machine-readable. No Division polygon layer: dissolve the tikina layer on `Division` (Central, Eastern, Northern, Western); geometry_method dissolved_from_children. Rotuma tikina are attributed to Eastern."
      - level_code: admin2
        level_type: state_province
        level_name_local: Province (Yasana)
        layer: 2017_phc_fji_pid_4326.geojson
        name_field: Province
        code_field: pid
        code_scheme: sdd-census
        parent_field: null
        nests: true
        notes: "15 units = 14 provinces + Rotuma (dependency). Parent division via tikina layer (Province->Division)."
      - level_code: admin3
        level_type: district
        level_name_local: Tikina
        layer: 2017_phc_fji_tid_4326.geojson
        name_field: Tikina
        code_field: tid17
        code_scheme: sdd-census
        parent_field: pid
        nests: true
        notes: "86 tikina (consolidated 'new' tikina used by FBoS)."
      - level_code: admin4
        level_type: statistical
        level_name_local: Enumeration Area
        layer: 2017_phc_fji_eaid_4326.geojson
        name_field: label
        code_field: ea2017
        code_scheme: sdd-census
        parent_field: Tik_No
        nests: true
        notes: "1,982 EAs. Field `Ward` carries urban ward / peri-urban / Rural labels (e.g. 'Tamavua Ward'); could be used to approximate municipal wards but is not an official council boundary."
    status: selected
    raw_path: data/raw/FJI/fji-sdd-phc2017-boundaries/
    derived_from: []
    notes: "Tier 1 (national statistics office census geography hosted on PDH, open licence) and the most recently published. Geometry differs from the COD-AB (tikina area total ~2.6% different, vertex density ~half), see decisions (escalated)."

