[project]
name = "pacific-admin-boundaries"
version = "0.1.0"
description = "Harmonised Pacific administrative and jurisdictional boundaries (EEZ to finest public level) as GeoParquet + STAC"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mitchell Lyons" }]
keywords = ["pacific", "administrative boundaries", "eez", "geoparquet", "stac"]

dependencies = [
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "pyarrow>=17",
    "shapely>=2.0",
    "pyproj",
    "pandas",
    "numpy",
    "pystac>=1.10",
    "stac-geoparquet",
    "obstore",
    "typer",
    "requests",
    "pyyaml",
    "duckdb",
    "rich",
    "jsonschema",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pre-commit",
    "mypy",
    "types-requests",
    "types-PyYAML",
    "folium",
    "matplotlib",
    "jupyter",
]

[project.scripts]
pab = "pab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pab"]

[tool.ruff]
fix = true

[tool.ruff.lint]
# EXE002: the repo lives in OneDrive, which marks every file executable
ignore = ["E501", "EXE002"]
extend-select = ["ANN", "I", "RUF", "UP"]

[tool.mypy]
ignore_missing_imports = true
